[project]
name = "exe-remover-security-bot"
version = "3.5.1"
description = "Telegram executable-file moderation bot with coordinated workflows and a bilingual Mini App dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot[webhooks,job-queue]==21.5",
  "python-dotenv==1.0.1",
  "httpx==0.27.0",
  "redis==5.0.8",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
exe-remover-bot = "exe_remover_bot_app.bot:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["exe_remover_bot_app/translations.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["exe_remover_bot"]

[tool.setuptools.packages.find]
include = ["exe_remover_bot_app*"]

[tool.setuptools.package-data]
exe_remover_bot_app = ["static/*"]
